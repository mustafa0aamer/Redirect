<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحويل...</title>
    
    <!-- الطريقة الأولى للتحويل التلقائي والفوري (Meta Refresh) -->
    <meta http-equiv="refresh" content="0; url=https://script.google.com/a/*/macros/s/AKfycbxN7eMgYO8LQ1JgLQcb3zROlOhc_mYwdZHzCtt1FSf87Mx_oN9x6fVVU16IfFYFgGof4A/exec">
    
    <!-- الطريقة الثانية للتحويل التلقائي (JavaScript) للتأكيد -->
    <script type="text/javascript">
        window.location.replace("https://script.google.com/a/*/macros/s/AKfycbxN7eMgYO8LQ1JgLQcb3zROlOhc_mYwdZHzCtt1FSf87Mx_oN9x6fVVU16IfFYFgGof4A/exec");
    </script>

    <!-- تصميم بسيط للصفحة (في حالة ظهرت لجزء من الثانية) -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
        }
        .container {
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0d6efd;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h2>جاري تحويلك للصفحة المطلوبة...</h2>
        <p>إذا لم يتم التحويل تلقائياً خلال ثوانٍ، <a href="https://script.google.com/a/*/macros/s/AKfycbxN7eMgYO8LQ1JgLQcb3zROlOhc_mYwdZHzCtt1FSf87Mx_oN9x6fVVU16IfFYFgGof4A/exec">اضغط هنا</a>.</p>
    </div>
</body>
</html>
